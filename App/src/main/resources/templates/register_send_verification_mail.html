<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org">
<head>
<meta name="_csrf" th:content="${_csrf.token}"/>
<meta name="_csrf_header" th:content="${_csrf.headerName}"/>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<h2>Sent email,if u dont receive it yet , plz check confirmation email in spam box</h2>
<button id="resendBtn" onclick="resendEmail()">Resend confirmation email</button>
<input id="email" type="hidden" th:value="${resendMail}"/>
<p id="resendMsg"></p>

<script>
let cooldown = 0;
let timer = null;
const btn = document.getElementById('resendBtn');
const msg = document.getElementById('resendMsg');

$(document).ajaxSend(function(event, xhr, settings) {
    const token = $('meta[name="_csrf"]').attr('content');
    const header = $('meta[name="_csrf_header"]').attr('content');

    xhr.setRequestHeader(header, token);
});

function startCooldown(seconds) {
    cooldown = seconds;
    btn.disabled = true;
    clearInterval(timer);
    timer = setInterval(() => {
        cooldown--;
        btn.textContent = `Resend confirmation email (${cooldown}s)`;
        if (cooldown <= 0) {
            clearInterval(timer);
            btn.disabled = false;
            btn.textContent = 'Resend confirmation email';
        }
    }, 1000);
}

async function resendEmail() {
    const email = document.getElementById('email').value; // wherever you store it
    btn.disabled = true;
    msg.textContent = '';

        type: "POST",

</script>
