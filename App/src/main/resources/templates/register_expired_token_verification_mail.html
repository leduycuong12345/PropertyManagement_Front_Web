<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org">
<head>
<meta name="_csrf" th:content="${_csrf.token}"/>
<meta name="_csrf_header" th:content="${_csrf.headerName}"/>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
<h2>Expired token,please send another confirmation mail</h2>
<button id="resendBtn" onclick="resendEmail()">Resend confirmation email</button>
<input id="email" type="hidden" th:value="${resendEmail}"/> 
<p id="resendMsg"></p>

<script>
let cooldown = 0;
let timer = null;
const btn = document.getElementById('resendBtn');
const msg = document.getElementById('resendMsg');

var token = $("meta[name='_csrf']").attr("content");
var header = $("meta[name='_csrf_header']").attr("content");

function startCooldown(seconds) {
    cooldown = seconds;
    btn.disabled = true;
    clearInterval(timer);
    timer = setInterval(() => {
        cooldown--;
        btn.textContent = `Resend confirmation email (${cooldown}s)`;
        if (cooldown <= 0) {
            clearInterval(timer);
            btn.disabled = false;
            btn.textContent = 'Resend confirmation email';
        }
    }, 1000);
}

async function resendEmail() {
    const email = document.getElementById('email').value; // wherever you store it
    btn.disabled = true;
    msg.textContent = '';
	
    
    
    $.ajax({
        type: "POST",
        contentType: "application/json",
        url: '/api/register/auth/resend-verification?email='+ encodeURIComponent(email),
        beforeSend: function(xhr) {
            xhr.setRequestHeader(header, token);
        },
        success: function(response) {
        	msg.textContent = 'Verification email resent. Check your inbox.';
            startCooldown(60);
        },
        error: function(error) {
            console.log("Lỗi : " + error);
            msg.textContent = data.message || 'Something went wrong.';
            btn.disabled = false;
        }
    });
}

// Start the cooldown right after initial registration too,
// since the first email was just sent
startCooldown(60);
</script>
</body>
</html>
